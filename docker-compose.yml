# Umbry — run the Player (web app) and the optional sync Server together.
#
# Quick start (pulls the prebuilt images):
#   docker compose up -d
#
# Prefer to build from the source in this repo instead? Comment out each
# `image:` line and uncomment the matching `build:` line, then:
#   docker compose up -d --build
#
# Everything below is safe to tweak — ports, the data volume, the environment.
# Don't want sync? Delete the whole "server" block.

services:
  # The Umbry Player — the web app you watch in (open it in a browser).
  player:
    image: ghcr.io/umbryapp/umbry-player:latest
    # build: ./player
    container_name: umbry-player
    ports:
      - "8080:80"          # host:container — change 8080 to any free host port
    restart: unless-stopped

  # The optional Umbry Server — syncs your settings across devices.
  # It never touches your media. Delete this block if you only want the Player.
  server:
    image: ghcr.io/umbryapp/umbry-server:latest
    # build: ./server
    container_name: umbry-server
    ports:
      - "8790:8790"        # connect the Player to http://<host>:8790
    volumes:
      - umbry-data:/data   # accounts, settings, and the auto-generated keys live here
    # environment:         # all optional — sensible defaults are built in
    #   - TOKEN_TTL=30d
    #   - CORS_ORIGINS=https://umbry.example.com   # comma-separated; default allows any
    restart: unless-stopped

volumes:
  umbry-data:
