server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }

    # hashed static assets can be cached hard
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|eot|wasm|mp4|mp3)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
