            left: 0;

        /* Umbry cinematic boot splash (inlined for instant paint) */
        /* ---- Umbry boot splash: living gradient (aurora) ---- */
        .jpx-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;
            background: radial-gradient(ellipse 120% 100% at 50% 45%, #0c0a14 0%, #08070d 55%, #050509 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: jpxSplashFade 0.4s ease;
        }
        @keyframes jpxSplashFade { from { opacity: 0; } to { opacity: 1; } }
        .jpx-aurora { position: absolute; inset: -15%; z-index: 1; filter: blur(78px); }
        .jpx-aurora-blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
        .jpx-aurora-1 {
            width: 58vw; height: 58vw; left: 12%; top: 18%;
            background: radial-gradient(circle, rgba(255, 154, 75, 0.78) 0%, rgba(255, 154, 75, 0) 62%);
            animation: jpxAur1 19s ease-in-out infinite;
        }
        .jpx-aurora-2 {
            width: 52vw; height: 52vw; left: 42%; top: 28%;
            background: radial-gradient(circle, rgba(147, 133, 245, 0.72) 0%, rgba(147, 133, 245, 0) 62%);
            animation: jpxAur2 23s ease-in-out infinite;
        }
        .jpx-aurora-3 {
            width: 46vw; height: 46vw; left: 28%; top: 8%;
            background: radial-gradient(circle, rgba(199, 123, 216, 0.72) 0%, rgba(199, 123, 216, 0) 62%);
            animation: jpxAur3 27s ease-in-out infinite;
        }
        @keyframes jpxAur1 { 0%, 100% { transform: translate(-8%, -4%) scale(1); } 33% { transform: translate(16%, 10%) scale(1.22); } 66% { transform: translate(4%, -13%) scale(0.94); } }
        @keyframes jpxAur2 { 0%, 100% { transform: translate(8%, 6%) scale(1.1); } 40% { transform: translate(-15%, 12%) scale(0.88); } 72% { transform: translate(-3%, -11%) scale(1.28); } }
        @keyframes jpxAur3 { 0%, 100% { transform: translate(-6%, 9%) scale(0.95); } 50% { transform: translate(13%, -9%) scale(1.18); } }
        .jpx-splash-vignette {
            position: absolute; inset: 0; z-index: 2;
            background: radial-gradient(ellipse 62% 62% at 50% 48%, transparent 34%, rgba(5, 5, 9, 0.5) 72%, rgba(5, 5, 9, 0.92) 100%);
        }
